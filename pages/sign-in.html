<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a14" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Sign in to Dumpy.">
  <title>Sign in · Dumpy</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="sign-in" data-root="../" class="">
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="auth">
    <div id="step-form">
      <img class="auth__logo" src="../assets/favicon.svg" alt="" width="72" height="72">
      <h1 class="auth__title">Dumpy</h1>
      <p class="auth__lead">Give away or sell your extra stuff to neighbours.</p>
      <form id="sign-in-form" class="auth__form">
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" type="email" inputmode="email" autocomplete="email" required placeholder="you@example.com">
          <span class="hint">We will email you a link to sign in. No password needed.</span>
        </div>
        <button type="submit" class="btn btn--primary btn--lg btn--block">Send sign-in link</button>
      </form>
      <p class="auth__foot">Have an invite code? <a href="join.html">Join your society</a></p>
    </div>
    <div id="step-sent" class="center" hidden>
      <div class="big-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
      <h1 tabindex="-1">Check your email</h1>
      <p class="auth__lead">We sent a sign-in link to <strong id="sent-email"></strong>. Open it on this phone.</p>
      <div class="auth__form stack-sm">
        <button type="button" class="btn btn--outline btn--block" id="use-other">Use a different email</button>
        <a class="btn btn--primary btn--block" href="join.html">Preview: continue to join</a>
      </div>
    </div>
  </main>
  <script src="../js/mock.js"></script>
  <script src="../js/render.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a14" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Join your society on Dumpy.">
  <title>Join your society · Dumpy</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="join" data-root="../" class="">
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="auth">
    <div id="step-form">
      <div class="big-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div>
      <h1 class="auth__title">Join your society</h1>
      <p class="auth__lead">Ask your society admin for the invite code.</p>
      <form id="join-form" class="auth__form">
        <div class="field">
          <label class="label" for="code">Invite code</label>
          <input class="input code-input" id="code" required maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DEMO42">
        </div>
        <button type="submit" class="btn btn--primary btn--lg btn--block">Join</button>
      </form>
      <p class="auth__foot"><a href="sign-in.html">Back to sign in</a></p>
    </div>
    <div id="step-wait" class="center" hidden>
      <div class="big-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <h1 tabindex="-1">Waiting for approval</h1>
      <p class="auth__lead">Your request to join Demo Society has been sent. An admin will approve it soon, and you will get an email.</p>
      <div class="auth__form">
        <a class="btn btn--primary btn--block" href="../index.html">Preview: open the app</a>
      </div>
    </div>
  </main>
  <script src="../js/mock.js"></script>
  <script src="../js/render.js"></script>
</body>
</html>
